name: fiyat_takip
description: "Fiyat Takip Uygulaması - E-ticaret ürünlerini takip etme uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^13.0.0
  
  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # HTTP & Scraping
  http: ^1.1.2
  html: ^0.15.4
  webview_flutter: ^4.4.2
  puppeteer: ^3.6.0
  
  # Background Tasks
  workmanager: ^0.9.0
  
  # Notifications
  flutter_local_notifications: ^16.3.0
  
  # Charts
  fl_chart: ^0.66.0
  
  # Sharing
  receive_sharing_intent: ^1.4.5
  
  # Utils
  uuid: ^4.2.1
  intl: ^0.20.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8
  drift_dev: ^2.14.1

flutter:
  uses-material-design: true
